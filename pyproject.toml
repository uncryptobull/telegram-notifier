[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-notifier-desktop"
version = "0.2.0"
description = "Online and private-chat typing notifications for Windows"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["telegram_notifier*"]

[tool.setuptools.package-data]
telegram_notifier = ["notify.ps1", "assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
